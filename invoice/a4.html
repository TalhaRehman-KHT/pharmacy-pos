<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
    <title>Invoice</title>
    <style>
      @page {
        size: A4;
        margin: 14mm 12mm;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #111;
      }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 12px;
        line-height: 1.4;
      }
      .sheet {
        border: 1.5px solid #222;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border-bottom: 1.5px solid #222;
      }
      .shop-name {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .title {
        text-align: right;
      }
      .title h1 {
        margin: 0 0 6px;
        font-size: 20px;
        letter-spacing: 2px;
      }
      .copy {
        display: inline-block;
        margin-bottom: 6px;
        padding: 2px 8px;
        border: 1.5px solid #222;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .meta {
        border-collapse: collapse;
        margin-left: auto;
      }
      .meta th {
        text-align: left;
        font-weight: 600;
        padding: 1px 10px 1px 0;
      }
      .meta td {
        text-align: right;
        padding: 1px 0;
      }
      .party {
        display: flex;
        gap: 24px;
        padding: 8px 16px;
        border-bottom: 1px solid #222;
      }
      .party:empty {
        display: none;
      }
      .lines {
        width: 100%;
        border-collapse: collapse;
      }
      .lines th,
      .lines td {
        border: 1px solid #555;
        padding: 6px 8px;
        vertical-align: top;
      }
      .lines tr > :first-child {
        border-left: 0;
      }
      .lines tr > :last-child {
        border-right: 0;
      }
      .lines thead th {
        background: #eee;
        text-align: left;
        border-top: 0;
      }
      .lines thead tr {
        break-inside: avoid;
      }
      .lines tbody tr {
        break-inside: avoid;
      }
      .num {
        text-align: right !important;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .bottom {
        display: flex;
        border-top: 1.5px solid #222;
        break-inside: avoid;
      }
      .payment {
        flex: 1;
        padding: 12px 16px;
        border-right: 1px solid #222;
      }
      .payment h2 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .payment table,
      .totals {
        border-collapse: collapse;
      }
      .payment td {
        padding: 2px 16px 2px 0;
      }
      .totals {
        width: 260px;
      }
      .totals th,
      .totals td {
        padding: 6px 16px;
        border-bottom: 1px solid #999;
      }
      .totals th {
        text-align: left;
        font-weight: 600;
      }
      .totals tr:last-child th,
      .totals tr:last-child td {
        border-bottom: 0;
        border-top: 1.5px solid #222;
        font-size: 15px;
        font-weight: 700;
      }
      .footer {
        padding: 10px 16px;
        border-top: 1px solid #222;
        text-align: center;
        white-space: pre-line;
        break-inside: avoid;
      }
      .error {
        padding: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main id="invoice"></main>
    <script>
      const params = new URLSearchParams(location.search)

      function el(tag, className, text) {
        const node = document.createElement(tag)
        if (className) node.className = className
        if (text != null) node.textContent = text
        return node
      }

      function cells(tag, values, numFrom = Infinity) {
        const tr = el('tr')
        values.forEach((v, i) => tr.append(el(tag, i >= numFrom ? 'num' : null, v)))
        return tr
      }

      function keyValue(label, value) {
        const tr = el('tr')
        tr.append(el('th', null, label), el('td', 'num', value))
        return tr
      }

      function money(n) {
        return (Number(n) || 0).toLocaleString('en-PK', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      }

      function timestamp(iso) {
        return new Date(iso).toLocaleString('en-PK', {
          day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
        })
      }

      function settlementLabel(payments) {
        const methods = new Set(payments.map((p) => p.method))
        if (methods.size > 1) return 'Split (cash + card)'
        if (methods.has('card')) return 'Card'
        if (methods.has('cash')) return 'Cash'
        return '-'
      }

      function render({ sale, items, payments, shop }) {
        const sheet = el('div', 'sheet')

        const head = el('header', 'head')
        const shopBlock = el('div')
        shopBlock.append(el('div', 'shop-name', shop.name))
        if (shop.address) shopBlock.append(el('div', null, shop.address))
        if (shop.phone) shopBlock.append(el('div', null, `Phone: ${shop.phone}`))
        if (shop.licence_no) shopBlock.append(el('div', null, `Drug sale licence: ${shop.licence_no}`))

        const titleBlock = el('div', 'title')
        titleBlock.append(el('h1', null, 'INVOICE'))
        if (params.get('copy') === 'duplicate') titleBlock.append(el('div', 'copy', 'DUPLICATE COPY'))
        const meta = el('table', 'meta')
        meta.append(keyValue('Invoice no.', sale.invoice_no))
        meta.append(keyValue('Date', timestamp(sale.created_at)))
        meta.append(keyValue('Operator', sale.operator_name || '-'))
        titleBlock.append(meta)
        head.append(shopBlock, titleBlock)
        sheet.append(head)

        const party = el('div', 'party')
        if (sale.customer_name) party.append(el('div', null, `Customer: ${sale.customer_name}`))
        if (sale.customer_phone) party.append(el('div', null, `Phone: ${sale.customer_phone}`))
        if (sale.doctor_name) party.append(el('div', null, `Doctor: ${sale.doctor_name}`))
        sheet.append(party)

        const table = el('table', 'lines')
        const thead = el('thead')
        thead.append(cells('th', ['#', 'Medicine', 'Batch', 'Qty', 'Rate (PKR)', 'Amount (PKR)'], 3))
        const tbody = el('tbody')
        items.forEach((item, i) => {
          tbody.append(
            cells('td', [
              String(i + 1),
              item.medicine_name,
              item.batch_no || '-',
              String(item.qty),
              money(item.unit_price),
              money(item.line_total),
            ], 3),
          )
        })
        table.append(thead, tbody)
        sheet.append(table)

        const bottom = el('section', 'bottom')
        const pay = el('div', 'payment')
        pay.append(el('h2', null, `Payment: ${settlementLabel(payments)}`))
        const payTable = el('table')
        for (const p of payments) {
          if (p.method === 'cash') {
            payTable.append(cells('td', ['Cash', money(p.amount)], 1))
            if (p.tendered != null) {
              payTable.append(cells('td', ['Tendered', money(p.tendered)], 1))
              payTable.append(cells('td', ['Change', money(p.change)], 1))
            }
          } else {
            payTable.append(cells('td', [p.reference ? `Card (ref ${p.reference})` : 'Card', money(p.amount)], 1))
          }
        }
        pay.append(payTable)

        const totals = el('table', 'totals')
        totals.append(keyValue('Subtotal', money(sale.subtotal)))
        totals.append(keyValue('Discount', `-${money(sale.discount)}`))
        totals.append(keyValue('Tax', money(sale.tax)))
        totals.append(keyValue('Total (PKR)', money(sale.total)))
        bottom.append(pay, totals)
        sheet.append(bottom)

        if (shop.footer) sheet.append(el('footer', 'footer', shop.footer))

        document.getElementById('invoice').append(sheet)
      }

      async function main() {
        try {
          const res = await window.invoice.getSale(params.get('id'))
          if (!res?.ok) throw new Error(res?.error || 'Could not load the sale.')
          render(res.data)
          window.invoice.rendered({
            invoiceNo: res.data.sale.invoice_no,
            heightPx: Math.ceil(document.documentElement.scrollHeight),
          })
        } catch (err) {
          document.getElementById('invoice').replaceChildren(el('div', 'error', err.message))
          window.invoice.rendered({ error: err.message })
        }
      }

      main()
    </script>
  </body>
</html>
